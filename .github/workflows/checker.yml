name: checker

# 검사 엔진이 플러그인 밖에 있는 이유가 팀원 PC(Windows)와 Actions(Linux) 두 곳에서 같은
# 엔진이 돌아야 하기 때문이므로, 양쪽에서 같은 결과가 나오는지가 곧 이 저장소의 전제다.
# 한쪽에서만 돌리면 경로 구분자, 파일명 대소문자 구분, 줄바꿈, 한글 인코딩 차이를 놓친다.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --all-extras --dev

      - name: 테스트
        run: uv run pytest -q

      - name: CLI 계약 확인 (통과는 0)
        shell: bash
        run: |
          uv run python checker/tests/make_fixtures.py
          F=checker/tests/fixtures/client-docs/sample
          uv run doc-guard --rules "$F/rules" "$F/docs/제안서/20260921_로그인_제안서.md"

      - name: CLI 계약 확인 (위반은 1)
        shell: bash
        run: |
          F=checker/tests/fixtures/client-docs/sample
          set +e
          uv run doc-guard --rules "$F/rules" "$F/docs/제안서/제안서최종.md" > /dev/null
          code=$?
          set -e
          test "$code" -eq 1 || { echo "종료코드가 1이 아니라 $code 다"; exit 1; }

      # 프로젝트 저장소에는 문서만 있고 규칙은 문서 저장소에 있다. 재사용 워크플로가
      # 실제로 부르는 그 모양을 그대로 확인한다. 한글 경로가 섞인 채 두 운영체제에서
      # 같은 결과가 나와야 하므로, 이 저장소의 전제를 지키는 자리이기도 하다.
      # 임시 저장소를 작업 디렉터리 안에 만든다. RUNNER_TEMP 는 Windows 러너에서
      # 역슬래시 경로라 bash 와 파이썬 사이에서 어긋난다.
      - name: CLI 계약 확인 (규칙이 다른 트리에 있어도 위반은 1)
        shell: bash
        run: |
          F=checker/tests/fixtures/client-docs/sample
          P=.tmp-프로젝트저장소
          mkdir -p "$P/docs/제안서"
          cp "$F/docs/제안서/제안서최종.md" "$P/docs/제안서/"
          echo "$P/docs/제안서/제안서최종.md" > "$P/changed.txt"
          set +e
          uv run python scripts/check_changed.py "$P/changed.txt" \
            --rules "$F/rules" --root "$P" > /dev/null
          code=$?
          set -e
          test "$code" -eq 1 || { echo "종료코드가 1이 아니라 $code 다"; exit 1; }

      - name: CLI 계약 확인 (기준 경로를 빠뜨리면 통과가 아니라 2)
        shell: bash
        run: |
          P=.tmp-프로젝트저장소
          set +e
          uv run python scripts/check_changed.py "$P/changed.txt" \
            --rules checker/tests/fixtures/client-docs/sample/rules > /dev/null
          code=$?
          set -e
          test "$code" -eq 2 || { echo "종료코드가 2가 아니라 $code 다"; exit 1; }
